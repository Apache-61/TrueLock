version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: truelock-postgres
    environment:
      POSTGRES_USER: truelock
      POSTGRES_PASSWORD: truelock_dev
      POSTGRES_DB: truelock
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truelock -d truelock"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://truelock:truelock_dev@postgres:5432/truelock
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
